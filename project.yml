name: YatseRemote
options:
  bundleIdPrefix: com.bpawnzz
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupOrdering:
    - order: [App, Core, UI, Resources]

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  YatseRemote:
    type: application
    platform: iOS
    sources:
      - path: YatseRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpawnzz.yatseremote
        PRODUCT_NAME: YatseRemote
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: YatseRemote/Info.plist
      properties:
        CFBundleDisplayName: Yatse Remote
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Kodi speaks plain HTTP on the LAN; ATS needs the local-networking
        # exception or every request to a raw IP is blocked on device.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Yatse Remote talks to your Kodi media centre on your local network to
          send remote-control commands and browse your library.
        NSBonjourServices:
          - _xbmc-jsonrpc-h._tcp
          - _xbmc-jsonrpc._tcp

  YatseRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YatseRemoteTests
    dependencies:
      - target: YatseRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bpawnzz.yatseremote.tests
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_REQUIRED: "NO"

schemes:
  YatseRemote:
    build:
      targets:
        YatseRemote: all
        YatseRemoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YatseRemoteTests
