schema: spec-driven

context: |
  YatseRemote is a clean-room SwiftUI iOS remote for Kodi, specified from static
  analysis of the Yatse 12.0.0 Android APK. Constraints an agent cannot infer by
  reading the code:

  - There is no macOS host and no Xcode in this environment. Swift cannot be
    compiled, tested, or run locally. Compilation and unit tests happen only in
    GitHub Actions on a macos-26 runner (`build-ipa.yml`, `tests.yml`); verify
    work by pushing a branch and reading the run, and state plainly when a claim
    is unverified rather than asserting it.
  - `YatseRemote.xcodeproj` is generated by `xcodegen` from `project.yml` and is
    gitignored. `project.yml` is the source of truth; Info.plist content,
    including NSAppTransportSecurity and NSBonjourServices, is declared there.
  - The reverse-engineering evidence (REPORT.md, the decompiled APK, the live
    probe harness) lives outside the repository at ~/reverseEngineer/yatse/ and
    is NOT available to CI. Do not write tasks that require it from CI, and do
    not commit decompiled Yatse source, resources, artwork or string tables into
    this repository — it is a clean-room build.
  - A live Kodi 21.3 box is reachable at 10.13.13.7:8080 with HTTP Basic auth and
    can be probed from the development host only, never from CI. Probe scripts
    must stay read-only (no Input.ExecuteAction, no playlist mutation, no
    settings writes) because the box may be playing something.
  - Supported protocol is Kodi JSON-RPC v13 only. Plex/Emby/Jellyfin backends,
    DLNA casting, offline download and PVR are deliberately out of scope.
  - There are no license gates, trials, IAP or ad surfaces, by design. Do not
    add any.
  - Units are seconds; API surface is `async`/`await` with `@MainActor` on state
    mutation, matching the existing files.

